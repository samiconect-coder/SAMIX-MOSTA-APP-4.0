
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.samix.mosta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.samix.mosta'

        minSdk 23
        targetSdk 35

        versionCode 4
        versionName '4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}
